[package]
name = "spacetop"
version = "0.1.0"
edition = "2024"
default-run = "spacetop"

[workspace]
members = [".", "utils/spacelauncher", "utils/spacetop-config", "utils/spacesettings", "utils/cursor-position"]
default-members = ["."]
resolver = "3"

[dependencies]
anyhow = "1"
ash = { version = "0.38", default-features = false, features = ["loaded", "std"] }
bytemuck = "1"
calloop = "0.14"
evdev = "0.13"
glam = { version = "0.34", features = ["bytemuck"] }
half = "2"
image = { version = "0.25", default-features = false, features = ["exr"] }
naga = { version = "30", features = ["wgsl-in", "spv-out"] }
notify = "8"
openxr = { version = "0.22", default-features = false, features = ["loaded"] }
rayon = "1"
rand = "0.10"
smithay = { version = "0.7.0", default-features = false, features = ["desktop", "wayland_frontend", "renderer_gl", "backend_gbm", "backend_gbm_has_create_with_modifiers2", "backend_gbm_has_fd_for_plane", "xwayland"] }
spacetop-config = { path = "utils/spacetop-config" }
udev = "0.9"

[dev-dependencies]
tempfile = "3"
toml = "1.1"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
